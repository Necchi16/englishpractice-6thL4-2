    function MiniGame({ playerStage, onFinish }) {
      const [timeLeft, setTimeLeft] = useState(15);
      const [coins, setCoins] = useState(0);
      
      const [playerPos, setPlayerPos] = useState({ x: 50, y: 50 });
      const [coinPos, setCoinPos] = useState({ x: Math.random() * 80 + 10, y: Math.random() * 80 + 10 });
      
      const playerRef = useRef({ x: 50, y: 50 });
      const coinRef = useRef({ x: coinPos.x, y: coinPos.y });
      const keysRef = useRef({ ArrowUp: false, ArrowDown: false, ArrowLeft: false, ArrowRight: false });
      const requestRef = useRef();
      const isFinished = useRef(false);

      useEffect(() => {
        const timer = setInterval(() => {
          setTimeLeft(prev => {
            if (prev <= 1) {
              clearInterval(timer);
              return 0;
            }
            return prev - 1;
          });
        }, 1000);
        return () => clearInterval(timer);
      }, []);

      useEffect(() => {
        if (timeLeft === 0 && !isFinished.current) {
          isFinished.current = true;
          cancelAnimationFrame(requestRef.current);
          onFinish(coins);
        }
      }, [timeLeft, coins, onFinish]);

      useEffect(() => {
        const handleKeyDown = (e) => {
          if (keysRef.current.hasOwnProperty(e.key)) {
            keysRef.current[e.key] = true;
            e.preventDefault();
          }
        };
        const handleKeyUp = (e) => {
          if (keysRef.current.hasOwnProperty(e.key)) {
            keysRef.current[e.key] = false;
            e.preventDefault();
          }
        };
        window.addEventListener('keydown', handleKeyDown, {passive: false});
        window.addEventListener('keyup', handleKeyUp);
        return () => {
          window.removeEventListener('keydown', handleKeyDown);
          window.removeEventListener('keyup', handleKeyUp);
        };
      }, []);

      useEffect(() => {
        const updateGame = () => {
          if (timeLeft <= 0) return;

          const speed = 2.0;
          let dx = 0;
          let dy = 0;

          if (keysRef.current.ArrowUp) dy -= speed;
          if (keysRef.current.ArrowDown) dy += speed;
          if (keysRef.current.ArrowLeft) dx -= speed;
          if (keysRef.current.ArrowRight) dx += speed;

          let px = playerRef.current.x + dx;
          let py = playerRef.current.y + dy;
          px = Math.max(5, Math.min(95, px));
          py = Math.max(5, Math.min(95, py));
          
          playerRef.current = { x: px, y: py };
          setPlayerPos({ x: px, y: py });

          const cx = coinRef.current.x;
          const cy = coinRef.current.y;
          const hit = Math.hypot(px - cx, py - cy) < 12;
          
          if (hit) { 
            setCoins(c => c + 1);
            coinRef.current = {
              x: Math.random() * 80 + 10,
              y: Math.random() * 80 + 10
            };
            setCoinPos({...coinRef.current});
          }

          requestRef.current = requestAnimationFrame(updateGame);
        };
        requestRef.current = requestAnimationFrame(updateGame);
        return () => cancelAnimationFrame(requestRef.current);
      }, [timeLeft]);

      const handlePointer = (dir, isDown) => {
        keysRef.current[dir] = isDown;
      };

      return (
        <div className="min-h-screen bg-green-50 p-4 md:p-8 flex flex-col items-center justify-center">

            <div className="flex justify-between items-center mb-4 px-2">
              <div className="text-2xl font-bold text-gray-700">⏳ {timeLeft}びょう</div>
              <div className="text-2xl font-bold text-yellow-500">🪙 {coins} コイン</div>
            </div>
            
            <div className="relative w-full h-80 bg-green-100 rounded-xl overflow-hidden border-2 border-green-300">
              <div 
                className="absolute text-5xl transform -translate-x-1/2 -translate-y-1/2 drop-shadow-md z-10"
                style={{ left: `${playerPos.x}%`, top: `${playerPos.y}%` }}

              <div

                style={{ left: `${coinPos.x}%`, top: `${coinPos.y}%` }}
              >

            </div>

            <div className="grid grid-cols-3 gap-2 w-48 mx-auto mt-6 touch-none">
              <div />
              <button 
                className="bg-gray-200 active:bg-gray-400 p-4 rounded-xl text-2xl shadow select-none flex items-center justify-center"
                onPointerDown={() => handlePointer('ArrowUp', true)}
                onPointerUp={() => handlePointer('ArrowUp', false)}
                onPointerLeave={() => handlePointer('ArrowUp', false)}
              >⬆️</button>
              <div />
              <button

            <p className="text-center text-gray-500 mt-4 text-sm font-bold">じゅうじキーでも うごかせるよ</p>
          </div>

      );
    }

      const translateToEn = async (jaText, type) => {
        try {
          let query = jaText;
          if (type === 'ate') query = `私は${jaText}を食べました`;
          if (type === 'saw') query = `私は${jaText}を見ました`;
          if (type === 'wentTo') query = `私は${jaText}に行きました`;
          if (type === 'enjoyed') query = `私は${jaText}を楽しみました`;

          const res = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=ja&tl=en&dt=t&q=${encodeURIComponent(query)}`);
          const data = await res.json();
          let enText = data[0][0][0].toLowerCase().replace(/[\.\,\!]/g, '').trim();
          
          if (type === 'ate') enText = enText.replace(/^i ate /i, '').replace(/^i had /i, '');
          if (type === 'saw') enText = enText.replace(/^i saw /i, '').replace(/^i watched /i, '').replace(/^i looked at /i, '');
          if (type === 'wentTo') enText = enText.replace(/^i went to /i, '').replace(/^i visited /i, '');
          if (type === 'enjoyed') enText = enText.replace(/^i enjoyed /i, '').replace(/^i had fun /i, '');

          return enText.trim() || "something";
        } catch(e) {
          console.error("Translation error", e);
          return "something"; 
        }
      };

            !inputs.wentTo.word.trim() || !inputs.wentTo.feeling || 
            !inputs.enjoyed.word.trim() || !inputs.enjoyed.feeling) {
          alert("４つ すべての「日本語」と「感想」を にゅうりょく・せんたく してね！");
          return;
        }
        setIsTranslating(true);
        
        const ateEn = await translateToEn(inputs.ate.word, 'ate');
        const sawEn = await translateToEn(inputs.saw.word, 'saw');
        const wentToEn = await translateToEn(inputs.wentTo.word, 'wentTo');
        const enjoyedEn = await translateToEn(inputs.enjoyed.word, 'enjoyed');
        
        setAnswers({
          ate: { ja: inputs.ate.word, en: ateEn, feeling: inputs.ate.feeling },
          saw: { ja: inputs.saw.word, en: sawEn, feeling: inputs.saw.feeling },
          wentTo: { ja: inputs.wentTo.word, en: wentToEn, feeling: inputs.wentTo.feeling },
          enjoyed: { ja: inputs.enjoyed.word, en: enjoyedEn, feeling: inputs.enjoyed.feeling }
        });
        
        setIsTranslating(false);
        setStep('MY_SPEAK_ANSWER');
        setCurrentSpeakLine(0);
        setLineSuccessCount(0);
        setFailCount(0);
      };

      const saveWorksheet = () => {
        const data = { answers };
        localStorage.setItem('englishAppWorksheet_RPG', JSON.stringify(data));
        setWorksheetData(data);
      };

      const startApp = () => {
        setFailCount(0);
        setCurrentSpeakLine(0);
        setLineSuccessCount(0);
        setStep('COM_ASK');
      };

      const buyItem = () => {
        if (totalCoins >= 10) {
          const newCoins = totalCoins - 10;
          const newItems = { ...items, salmon: (items.salmon || 0) + 1 };
          saveData(playCount, newCoins, newItems, kummaniLevel, kummaniExp, cookedDishes);
          
          setPurchaseEffect('salmon');
          setTimeout(() => setPurchaseEffect(null), 1500);
        } else {
          alert("コインがたりないよ！ミニゲームであつめてね。");
        }
      };

      const feedKummani = () => {
        if (items.salmon >= 1) {
          const newItems = { ...items, salmon: items.salmon - 1 };
          setItems(newItems);
          
          const unownedDishes = DISHES.filter(d => !cookedDishes.includes(d));
          let dish = unownedDishes.length > 0 ? unownedDishes[Math.floor(Math.random() * unownedDishes.length)] : DISHES[Math.floor(Math.random() * DISHES.length)];
          
          setFeedEffect({ phase: 'cooking', dish: null });
          
          setTimeout(() => {
            setFeedEffect({ phase: 'done', dish: dish });
            const newDishes = cookedDishes.includes(dish) ? cookedDishes : [...cookedDishes, dish];
            
            setTimeout(() => {
              const newExp = kummaniExp + 1;
              
              if (nextStage && newExp >= nextStage.reqExp) {
                setFeedEffect({ phase: 'evolving', from: currentStage, to: nextStage });
                setTimeout(() => {
                   saveData(playCount, totalCoins, newItems, nextStage.id, newExp, newDishes);
                   setFeedEffect({ phase: 'evolved', to: nextStage });
                   setTimeout(() => setFeedEffect(null), 3000);
                }, 2500);
              } else {
                saveData(playCount, totalCoins, newItems, kummaniLevel, newExp, newDishes);
                setFeedEffect(null);
              }
            }, 2000);
          }, 1500);
        }
      };

      const handleBack = () => {
        setFailCount(0);
        setFeedbackMsg("");
        setIsListening(false);
        setCurrentSpeakLine(0);
        setLineSuccessCount(0);
        
        switch(step) {
          case 'COM_ASK': setStep('HOME'); break;
          case 'MY_INPUT_ANSWER': setStep('COM_ASK'); break;
          case 'MY_SPEAK_ANSWER': setStep('MY_INPUT_ANSWER'); break;
          case 'WORKSHEET_ANSWER': setStep('MY_SPEAK_ANSWER'); break;
          case 'COM_ANSWER': setStep('WORKSHEET_ANSWER'); break;
          case 'WORKSHEET_CHECK': setStep('COM_ANSWER'); break;
          case 'WORKSHEET_STAMP': setStep('WORKSHEET_CHECK'); break;
          case 'QUIZ_INTRO': setStep('WORKSHEET_STAMP'); break;
          default: break;
        }
      };

      const BackButton = () => (
        <button onClick={handleBack} className="absolute top-4 left-4 bg-white/90 backdrop-blur-sm text-gray-700 font-bold py-2 px-4 rounded-full shadow-md hover:bg-gray-100 flex items-center z-20 border-2 border-gray-200">
          <span className="mr-1">◀</span> もどる
        </button>
      );

      const speak = useCallback((text, rate = 0.9) => {
        if (synth.speaking) synth.cancel();
        const utterThis = new SpeechSynthesisUtterance(text);
        utterThis.lang = 'en-US';
        utterThis.rate = rate; 
        const voices = synth.getVoices();
        const englishVoice = voices.find(v => v.lang.includes('en-US') && v.name.includes('Female')) || voices.find(v => v.lang.includes('en-US'));
        if (englishVoice) utterThis.voice = englishVoice;
        synth.speak(utterThis);
      }, [synth]);

      useEffect(() => {
        if (step === 'COM_ASK') {
          setTimeout(() => speak(COM_ASK_TEXT.text), 500);
        } else if (step === 'COM_ANSWER') {
          setTimeout(() => speak(COM_ANS_TEXT.text), 500);
        }
      }, [step, speak]);

      const prepareQuiz = () => {
        const q = [];
        while(q.length < 4) {
          const r = Math.floor(Math.random() * QUIZ_WORDS.length);
          if(!q.includes(r)) q.push(r);
        }
        setQuizQuestions(q);
        setCurrentQuizIndex(0);
        setStep('QUIZ_INTRO');
      };

      const startListening = (targetType) => {
        if (!SpeechRecognition) {
          alert("お使いのブラウザは音声入力に対応していません。スキップして進んでください。");
          setFailCount(2); 
          return;
        }
        const recognition = new SpeechRecognition();
        recognition.lang = 'en-US';
        recognition.interimResults = false;
        recognition.maxAlternatives = 1;

        setIsListening(true);
        setFeedbackMsg("");

        recognition.onresult = (event) => {
          const transcript = event.results[0][0].transcript.toLowerCase();
          checkPronunciation(transcript, targetType);
        };
        recognition.onerror = () => {
          setIsListening(false);
          handleFail();
        };
        recognition.onend = () => setIsListening(false);
        recognition.start();
      };

      const handleFail = () => {
        setFailCount(prev => prev + 1);
        setFeedbackMsg("おしい！もういちどチャレンジ！\nマイクの場所はどこか確認をしよう。\n分からない人は先生を呼ぼう。\n自分の声がうまく入らない場合はイヤホンをとってやってみよう。");
      };

      const checkPronunciation = (transcript, targetType) => {
        const trans = transcript.toLowerCase();
        let isCorrect = false;
        
        if (targetType === 'MY_ANSWER') {
          let targetWord = "";
          let targetFeeling = "";
          
          if (currentSpeakLine === 0) { targetWord = answers.ate.en.split(' ')[0]; targetFeeling = answers.ate.feeling; }
          else if (currentSpeakLine === 1) { targetWord = answers.saw.en.split(' ')[0]; targetFeeling = answers.saw.feeling; }
          else if (currentSpeakLine === 2) { targetWord = answers.wentTo.en.split(' ')[0]; targetFeeling = answers.wentTo.feeling; }
          else if (currentSpeakLine === 3) { targetWord = answers.enjoyed.en.split(' ')[0]; targetFeeling = answers.enjoyed.feeling; }

          // 名詞または感想の単語が聞き取れていれば正解とする（難易度調整）
          if ((targetWord.length > 1 && trans.includes(targetWord)) || 
              (targetFeeling.length > 1 && trans.includes(targetFeeling))) {
              isCorrect = true;
          }
          if (trans.length > 15) isCorrect = true; // 救済処置

          if (isCorrect) {
             const newSuccessCount = lineSuccessCount + 1;
             
             if (newSuccessCount >= 3) {
                 if (currentSpeakLine < 3) {
                    setFeedbackMsg("Excellent! 👏 3回言えたね！\n次の文を言ってね！");
                    setTimeout(() => {
                       setCurrentSpeakLine(curr => curr + 1);
                       setLineSuccessCount(0);
                       setFeedbackMsg("");
                       setFailCount(0);
                    }, 2000);
                 } else {
                    setFeedbackMsg("Perfect! 👏 全部言えたね！");
                    setLineSuccessCount(3);
                    setCurrentSpeakLine(4);
                    setFailCount(0);
                 }
             } else {
                 setLineSuccessCount(newSuccessCount);
                 setFeedbackMsg(`Good! 👏 \nあと ${3 - newSuccessCount} 回言ってね！`);
                 setTimeout(() => {
                    setFeedbackMsg("");
                 }, 1500);
             }
          } else {
             handleFail();
          }
          return;
        } 
        else if (targetType === 'QUIZ') {
          if (quizQuestions.length > 0 && currentQuizIndex < quizQuestions.length) {
            const qWord = QUIZ_WORDS[quizQuestions[currentQuizIndex]];
            isCorrect = qWord.keywords.some(kw => trans.includes(kw));
          }
        }

        if (isCorrect) {
          setFeedbackMsg("Excellent! 👏");
          setTimeout(() => speak("Excellent!"), 500);
          setTimeout(() => proceedToNext(targetType), 2000);
        } else {
          handleFail();
        }
      };

      const proceedToNext = (fromType) => {
        setFailCount(0);
        setFeedbackMsg("");
        
        if (fromType === 'MY_ANSWER') setStep('WORKSHEET_ANSWER');
        if (fromType === 'QUIZ') {
          if (currentQuizIndex + 1 < 4) setCurrentQuizIndex(prev => prev + 1);
          else setStep('MINIGAME_INTRO');
        }
      };

      const handleInputChange = (id, field, val) => setInputs(prev => ({ ...prev, [id]: { ...prev[id], [field]: val } }));
      const handleWordOptionClick = (id, opt) => setInputs(prev => ({ ...prev, [id]: { ...prev[id], word: opt } }));
      const handleFeelingClick = (id, feeling) => setInputs(prev => ({ ...prev, [id]: { ...prev[id], feeling: feeling } }));

      let content = null;

      if (step === 'HOME') {
        content = (
          <div className="min-h-screen p-4 md:p-8 flex flex-col justify-center relative bg-blue-50 pb-20 overflow-hidden">
            {feedEffect && (
              <div className="fixed inset-0 bg-black/80 flex items-center justify-center z-50 p-4">
                <div className="bg-white rounded-3xl p-8 max-w-md w-full text-center shadow-2xl relative">
                  {feedEffect.phase === 'cooking' && (
                    <div className="animate-pulse">
                      <div className="text-8xl mb-4">🍳</div>
                      <p className="text-2xl font-bold text-orange-600">シャケを おりょうり中...</p>
                    </div>
                  )}
                  {feedEffect.phase === 'done' && (
                    <div className="animate-fade-in-up">
                      <div className="text-8xl mb-4">✨🍽️✨</div>
                      <p className="text-2xl font-bold text-orange-700 mb-6">{feedEffect.dish}</p>
                      <div className="text-7xl animate-bounce mb-2">{currentStage.emoji}</div>
                      <p className="text-lg font-bold text-gray-600 bg-gray-100 rounded-xl p-2 inline-block">クッマーニが 食べているよ！<br/>EXP +1</p>
                    </div>
                  )}
                  {feedEffect.phase === 'evolving' && (
                    <div>
                      <p className="text-2xl font-bold text-gray-800 mb-8">おや…？<br/>クッマーニの ようすが…！</p>
                      <div className="text-9xl animate-flash drop-shadow-2xl">{feedEffect.from.emoji}</div>
                    </div>
                  )}
                  {feedEffect.phase === 'evolved' && (
                    <div className="animate-bounce-in">
                      <p className="text-3xl font-extrabold text-yellow-500 mb-8">おめでとう！</p>
                      <div className="text-9xl mb-8 drop-shadow-[0_0_50px_rgba(253,224,71,0.8)]">{feedEffect.to.emoji}</div>
                      <p className="text-2xl font-bold text-gray-800">
                        <span className="text-blue-600 text-3xl">{feedEffect.to.name}</span> に<br/>しんかした！
                      </p>
                    </div>
                  )}
                </div>
              </div>
            )}

            {purchaseEffect && (
              <div className="fixed inset-0 pointer-events-none flex items-center justify-center z-50">
                <div className="animate-bounce-in text-9xl drop-shadow-2xl">🐟</div>
              </div>
            )}

            <div className="absolute top-4 right-4 bg-yellow-400 text-yellow-900 font-bold px-6 py-2 rounded-full border-4 border-yellow-200 shadow-lg text-xl z-10 flex gap-4">
              <span>🪙 {totalCoins}</span>
              <span>🐟 {items.salmon || 0}</span>
            </div>
            
            <div className="max-w-2xl w-full mx-auto bg-white rounded-3xl shadow-xl overflow-hidden border-4 border-blue-200 mt-16 md:mt-12">
              <div className="bg-gradient-to-r from-blue-400 to-indigo-500 p-8 text-center text-white relative">
                <h1 className="text-3xl md:text-4xl font-extrabold mb-4 drop-shadow-md mt-4">えいごで はなそう！</h1>
                <p className="text-lg bg-white/20 inline-block px-4 py-2 rounded-full font-medium mb-2">🎧 イヤホンを つけましょう 🎧</p>
              </div>
              
              <div className="p-8 text-center">
                {playCount > 0 && (
                  <div className="mb-6 bg-pink-50 p-5 rounded-2xl border-2 border-pink-200 shadow-sm animate-fade-in-up">
                    <p className="text-pink-800 font-bold text-base md:text-lg leading-relaxed mb-3">
                      このまま繰り返し練習するか、<br/>eステkids「<a href="https://e-st.kids-ebc.com/login/" target="_blank" rel="noopener noreferrer" className="text-blue-600 underline hover:text-blue-800 break-all">https://e-st.kids-ebc.com/login/</a>」をしましょう。
                    </p>
                    <a href="https://e-st.kids-ebc.com/login/" target="_blank" rel="noopener noreferrer" className="inline-flex items-center bg-pink-500 hover:bg-pink-600 text-white font-bold py-2 px-6 rounded-full shadow transition transform hover:scale-105 mt-2">
                      <span className="mr-2">📚</span> eステkids をひらく
                    </a>
                  </div>
                )}

                <button 
                  onClick={startApp}
                  className="bg-red-500 hover:bg-red-600 text-white text-2xl font-bold py-4 px-12 rounded-full shadow-lg transform transition hover:scale-105 active:scale-95 mx-auto mb-8 flex items-center"
                >
                  <span className="mr-2 text-2xl">▶️</span> えいかいわ スタート！
                </button>

                {playCount > 0 && (
                  <div className="mt-8 border-t-4 border-dashed border-gray-200 pt-8">
                    <h2 className="text-2xl font-bold text-gray-700 mb-6">🐻 クッマーニの おせわ 🐟</h2>
                    
                    <div className="bg-gradient-to-b from-blue-50 to-white p-6 rounded-3xl border-4 border-blue-100 mb-6 relative shadow-inner">
                      <div className="text-8xl mb-4 drop-shadow-lg">{currentStage.emoji}</div>
                      <h3 className="text-2xl font-bold text-blue-800 mb-2">{currentStage.name}</h3>
                      
                      {nextStage ? (
                        <div className="w-full max-w-xs mx-auto">
                          <div className="flex justify-between text-sm font-bold text-gray-500 mb-1">
                            <span>Lv.{currentStage.id}</span>
                            <span>つぎまで: あと {nextStage.reqExp - kummaniExp}</span>
                          </div>
                          <div className="h-4 bg-gray-200 rounded-full overflow-hidden border border-gray-300">
                            <div 
                              className="h-full bg-gradient-to-r from-yellow-400 to-orange-500 transition-all duration-500"
                              style={{ width: `${Math.min(100, Math.max(0, ((kummaniExp - currentStage.reqExp) / (nextStage.reqExp - currentStage.reqExp)) * 100))}%` }}
                            ></div>
                          </div>
                        </div>
                      ) : (
                        <div className="text-orange-500 font-bold bg-orange-50 inline-block px-4 py-1 rounded-full border border-orange-200">✨ さいしゅう しんか ✨</div>
                      )}
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                      <div className="bg-cyan-50 p-6 rounded-2xl border-2 border-cyan-200 flex flex-col items-center">
                        <div className="text-4xl mb-2">🐟</div>
                        <h3 className="font-bold text-cyan-800 mb-4">シャケをかう (10🪙)</h3>
                        <button onClick={buyItem} className="bg-cyan-500 text-white px-6 py-3 rounded-full font-bold shadow hover:bg-cyan-600 active:scale-95 w-full text-lg">買う！</button>
                      </div>
                      
                      <div className="bg-orange-50 p-6 rounded-2xl border-2 border-orange-200 flex flex-col items-center">
                        <div className="text-4xl mb-2">🍳</div>
                        <h3 className="font-bold text-orange-800 mb-4">おりょうりして あげる</h3>
                        <button 
                          onClick={feedKummani} 
                          disabled={items.salmon < 1}
                          className={`px-6 py-3 rounded-full font-bold shadow w-full text-lg transition ${items.salmon >= 1 ? 'bg-orange-500 hover:bg-orange-600 text-white transform hover:scale-105' : 'bg-gray-300 text-gray-500 cursor-not-allowed'}`}
                        >
                          {items.salmon >= 1 ? 'あげる！' : 'シャケが ないよ'}
                        </button>
                      </div>
                    </div>

                    {cookedDishes.length > 0 && (
                      <div className="mt-6 p-4 bg-orange-50 rounded-2xl text-left border-2 border-orange-200 shadow-sm">
                        <h4 className="font-bold text-orange-800 mb-3 flex items-center"><span className="mr-2 text-xl">🍽️</span> 作った料理のきろく ({cookedDishes.length} / {DISHES.length})</h4>
                        <ul className="text-sm font-bold text-gray-700 list-disc pl-6 space-y-1">
                          {cookedDishes.slice(-5).map((d, i) => <li key={i}>{getDishWithEmoji(d)}</li>)}
                        </ul>
                        {cookedDishes.length > 5 && <p className="text-xs text-gray-500 mt-2 pl-2">...ほか {cookedDishes.length - 5} こ</p>}
                      </div>
                    )}
                  </div>
                )}
              </div>
            </div>
          </div>
        );
      } else if (step === 'COM_ASK') {
        content = (
          <div className="min-h-screen bg-green-50 p-4 flex items-center justify-center relative">
            <BackButton />
            <div className="max-w-lg w-full bg-white rounded-3xl shadow-xl p-8 border-4 border-green-200 text-center mt-12">
              {renderHeader("クッマーニからの しつもん")}
              <CharacterMessage 
                text={COM_ASK_TEXT.text} 
                jpText={COM_ASK_TEXT.jpText} 
                isCom={true}
                emoji={currentStage.emoji}
                name={currentStage.name}
                onSpeak={speak}
              />
              <button onClick={() => setStep('MY_INPUT_ANSWER')} className="w-full bg-green-500 hover:bg-green-600 text-white text-xl font-bold py-4 rounded-xl shadow-md">こたえる</button>
            </div>
          </div>
        );
      } else if (step === 'MY_INPUT_ANSWER') {
        content = (
          <div className="min-h-screen bg-pink-50 p-4 flex flex-col items-center relative py-16">
            <BackButton />
            <div className="max-w-2xl w-full bg-white rounded-3xl shadow-xl p-4 md:p-6 border-4 border-pink-200 mt-8">
              {renderHeader("じぶんの こたえ")}
              <p className="text-gray-600 font-bold mb-4 text-center">なつやすみに あったことを おしえてね！</p>
              
              <div className="space-y-6 px-2 pb-4">
                <InputSection id="ate" label="I ate ... (食べたもの)" icon="🍎" placeholder="例: スイカ" color="red" options={SUGGESTIONS.ate} value={inputs.ate} onChange={handleInputChange} onWordOptionClick={handleWordOptionClick} onFeelingClick={handleFeelingClick} />
                <InputSection id="saw" label="I saw ... (見たもの)" icon="👀" placeholder="例: はなび" color="blue" options={SUGGESTIONS.saw} value={inputs.saw} onChange={handleInputChange} onWordOptionClick={handleWordOptionClick} onFeelingClick={handleFeelingClick} />
                <InputSection id="wentTo" label="I went to ... (行った場所)" icon="🚶‍♂️" placeholder="例: うみ" color="green" options={SUGGESTIONS.wentTo} value={inputs.wentTo} onChange={handleInputChange} onWordOptionClick={handleWordOptionClick} onFeelingClick={handleFeelingClick} />
                <InputSection id="enjoyed" label="I enjoyed ... (楽しんだこと)" icon="✨" placeholder="例: すいえい" color="yellow" options={SUGGESTIONS.enjoyed} value={inputs.enjoyed} onChange={handleInputChange} onWordOptionClick={handleWordOptionClick} onFeelingClick={handleFeelingClick} />
              </div>

              <button 
                onClick={handleTranslateAll} 
                disabled={isTranslating}
                className="w-full mt-4 bg-pink-500 hover:bg-pink-600 text-white text-xl font-bold py-5 rounded-xl shadow-md flex justify-center items-center sticky bottom-4 z-30"
              >
                {isTranslating ? <span className="animate-pulse">ほんやく中...</span> : 'えいごに して けってい！'}
              </button>
            </div>
          </div>
        );
      } else if (step === 'MY_SPEAK_ANSWER') {
        const sentenceLines = [
          `I ate ${answers.ate.en}. It was ${answers.ate.feeling}.`,
          `I saw ${answers.saw.en}. It was ${answers.saw.feeling}.`,
          `I went to ${answers.wentTo.en}. It was ${answers.wentTo.feeling}.`,
          `I enjoyed ${answers.enjoyed.en}. It was ${answers.enjoyed.feeling}.`
        ];

        content = (
          <div className="min-h-screen bg-pink-50 p-4 flex items-center justify-center relative py-12">
            <BackButton />
            <div className="max-w-3xl w-full bg-white rounded-3xl shadow-xl p-6 md:p-8 border-4 border-pink-200 text-center mt-12">
              {renderHeader("１ぎょうずつ いってみよう！")}
              <div className="bg-pink-100 p-4 md:p-6 rounded-2xl mb-6 shadow-inner text-left">
                <div className="space-y-4">
                   {[0,1,2,3].map((lineIndex) => {
                      const isActive = currentSpeakLine === lineIndex;
                      const isDone = currentSpeakLine > lineIndex;
                      const sentence = sentenceLines[lineIndex];
                      
                      let displayClass = "transition-all duration-300 flex flex-col md:flex-row md:items-center justify-between gap-3 ";
                      if (isActive) displayClass += "opacity-100 transform scale-105 border-4 border-pink-400 bg-white p-4 md:p-5 rounded-xl shadow-md relative z-10";
                      else if (isDone) displayClass += "opacity-50 text-gray-500 bg-gray-100 p-3 md:p-4 rounded-xl border border-gray-200";
                      else displayClass += "opacity-40 text-gray-400 p-3 md:p-4 bg-white/50 rounded-xl";

                      return (
                         <div key={lineIndex} className={displayClass}>
                            <span className={`text-lg md:text-xl font-worksheet font-bold ${isDone ? 'line-through' : ''} leading-relaxed`}>
                              {['①','②','③','④'][lineIndex]} {sentence}
                            </span>
                            <div className="flex items-center self-end md:self-auto gap-2">
                               {isActive && (
                                 <div className="text-xl flex gap-1 mr-2 bg-pink-50 px-3 py-1.5 rounded-full shadow-inner border border-pink-100">
                                   {Array.from({length: 3}).map((_, i) => (
                                     <span key={i}>{i < lineSuccessCount ? '⭐' : '☆'}</span>
                                   ))}
                                 </div>
                               )}
                               {isActive && (
                                 <button onClick={() => speak(sentence)} className="text-pink-600 bg-pink-50 p-3 rounded-full shadow-sm hover:bg-pink-100 border border-pink-200 text-xl">
                                   🔊
                                 </button>
                               )}
                               {isDone && <span className="text-green-500 text-3xl font-bold ml-2">✓</span>}
                            </div>
                         </div>
                      );
                   })}
                </div>
              </div>
              
              <div className="mb-8">
                {currentSpeakLine < 4 ? (
                  <>
                    <button onClick={() => startListening('MY_ANSWER')} disabled={isListening} className={`p-6 rounded-full shadow-lg ${isListening ? 'bg-red-500 animate-pulse' : 'bg-blue-500 hover:bg-blue-600'} text-white mx-auto text-4xl transition`}>🎤</button>
                    <p className="mt-4 text-gray-600 font-bold">{isListening ? "はなしてください..." : "マイクをおして はなす"}</p>
                  </>
                ) : (
                   <p className="text-3xl font-extrabold text-pink-600 animate-bounce mt-4">ぜんぶ 言えたね！✨</p>
                )}
                
                {feedbackMsg && (
                  <div className={`mt-6 text-lg md:text-xl font-black ${feedbackMsg.includes('Excellent') || feedbackMsg.includes('Perfect') || feedbackMsg.includes('Good') ? 'text-green-600 border-green-400 bg-green-50' : 'text-red-600 border-red-400 bg-red-50'} p-4 rounded-2xl border-4 text-left leading-relaxed shadow-lg whitespace-pre-line`}>
                    {feedbackMsg}
                  </div>
                )}
              </div>
              
              {currentSpeakLine < 4 && failCount >= 2 && (
                 <button onClick={() => {
                   setFailCount(0);
                   setFeedbackMsg("");
                   setLineSuccessCount(0);
                   if (currentSpeakLine < 3) setCurrentSpeakLine(c => c+1);
                   else proceedToNext('MY_ANSWER');
                 }} className="bg-gray-300 hover:bg-gray-400 py-3 px-6 rounded-xl font-bold mx-auto text-gray-700 shadow">
                   ⏭️ スキップ
                 </button>
              )}

              {currentSpeakLine >= 4 && (
                 <button onClick={() => proceedToNext('MY_ANSWER')} className="w-full bg-blue-500 hover:bg-blue-600 text-white text-2xl font-bold py-4 rounded-xl shadow-md mt-4 transition transform hover:scale-105">
                   つぎへ！
                 </button>
              )}
            </div>
          </div>
        );
      } else if (step === 'WORKSHEET_ANSWER') {
        content = (
          <div className="min-h-screen bg-yellow-50 p-4 flex items-center justify-center relative">
            <BackButton />
            <div className="max-w-3xl w-full bg-white rounded-3xl shadow-xl p-6 md:p-8 border-4 border-yellow-200 text-center mt-12">
              <h2 className="text-3xl font-bold text-yellow-700 mb-6 flex items-center justify-center"><span className="mr-2 text-4xl">📝</span>ワークシートに かこう！</h2>
              
              <div className="bg-white border-2 border-gray-300 p-6 md:p-8 rounded-lg shadow-inner mb-8 bg-[url('https://www.transparenttextures.com/patterns/lined-paper-2.png')]">
                <p className="text-base font-bold text-gray-600 mb-6 text-left bg-gray-100 inline-block px-3 py-2 rounded shadow-sm">
                  Q: {COM_ASK_TEXT.text}
                </p>
                <div className="mt-4">
                  <WorksheetLines data={{answers}} />
                </div>
              </div>
              
              <button onClick={() => setStep('COM_ANSWER')} className="w-full bg-blue-500 hover:bg-blue-600 text-white text-2xl font-bold py-4 rounded-xl shadow-md">かけた！</button>
            </div>
          </div>
        );
      } else if (step === 'COM_ANSWER') {
        content = (
          <div className="min-h-screen bg-green-50 p-4 flex items-center justify-center relative">
            <BackButton />
            <div className="max-w-lg w-full bg-white rounded-3xl shadow-xl p-8 border-4 border-green-200 text-center mt-12">
              {renderHeader("クッマーニからの へんじ")}
              
              <CharacterMessage 
                text={COM_ANS_TEXT.text}
                jpText={COM_ANS_TEXT.jpText}
                isCom={true}
                emoji={currentStage.emoji}
                name={currentStage.name}
                onSpeak={speak}
              />
              
              <button onClick={() => { 
                saveWorksheet(); 
                setStep(playCount === 0 ? 'WORKSHEET_STAMP' : 'WORKSHEET_CHECK'); 
              }} className="w-full bg-blue-500 hover:bg-blue-600 text-white text-xl font-bold py-4 rounded-xl shadow-md">つぎへ</button>
            </div>
          </div>
        );
      } else if (step === 'WORKSHEET_CHECK') {
        content = (
          <div className="min-h-screen bg-yellow-50 p-4 flex items-center justify-center relative">
            <BackButton />
            <div className="max-w-md w-full bg-white rounded-3xl shadow-xl p-8 border-4 border-yellow-200 text-center mt-12">
              <div className="text-6xl mb-6">📑</div>
              <h2 className="text-2xl font-bold text-gray-800 mb-8 leading-relaxed">もう ワークシートは<br/>書いたかな？</h2>
              
              <div className="flex flex-col gap-4">
                <button 
                  onClick={prepareQuiz} 
                  className="w-full bg-green-500 hover:bg-green-600 text-white text-xl font-bold py-4 rounded-xl shadow-md"
                >
                  はい（つぎへすすむ）
                </button>
                <button 
                  onClick={() => setStep('WORKSHEET_STAMP')} 
                  className="w-full bg-yellow-500 hover:bg-yellow-600 text-white text-xl font-bold py-4 rounded-xl shadow-md"
                >
                  いいえ（ワークシートを見る）
                </button>
              </div>
            </div>
          </div>
        );
      } else if (step === 'WORKSHEET_STAMP') {
        const displayData = worksheetData || { answers };

        content = (
          <div className="min-h-screen bg-yellow-50 p-4 flex items-center justify-center relative py-12">
            <BackButton />
            <div className="max-w-3xl w-full bg-white rounded-3xl shadow-xl p-6 md:p-8 border-4 border-yellow-200 mt-12">
              <div className="flex items-center justify-center text-yellow-600 mb-6 border-b-4 border-yellow-100 pb-4">
                <span className="mr-4 text-4xl">💮</span><h2 className="text-3xl font-bold">ワークシート かんせい！</h2>
              </div>
              
              <div className="bg-white border-2 border-gray-300 p-6 md:p-8 rounded-lg shadow-inner bg-[url('https://www.transparenttextures.com/patterns/lined-paper-2.png')] mb-8">
                <h3 className="font-bold text-xl text-blue-600 mb-4 bg-blue-100 inline-block px-3 py-1 rounded">【わたしの こたえ】</h3>
                <span className="text-gray-500 text-xs font-bold block mb-6 bg-gray-100 p-2 rounded inline-block font-sans">
                  Q: {COM_ASK_TEXT.text}
                </span>
                
                <WorksheetLines data={displayData} />
              </div>
              
              <div className="bg-red-50 p-6 rounded-xl border border-red-200 text-center mb-8 shadow-md">
                <p className="text-red-700 font-bold text-xl mb-3">先生を よんで スタンプを もらいましょう！</p>
                <p className="text-gray-700 font-bold text-lg">スタンプを もらったら、下のボタンを おしてね。</p>
              </div>
              <button onClick={prepareQuiz} className="w-full bg-yellow-500 hover:bg-yellow-600 text-white text-2xl font-bold py-5 rounded-xl flex items-center justify-center shadow-lg transform transition hover:scale-105"><span className="mr-3 text-3xl">💮</span> スタンプをもらった！</button>
            </div>
          </div>
        );
      } else if (step === 'QUIZ_INTRO') {
        content = (
          <div className="min-h-screen bg-indigo-50 p-4 flex items-center justify-center relative">
            <BackButton />
            <div className="max-w-lg w-full bg-white rounded-3xl shadow-xl p-8 text-center border-4 border-indigo-200 mt-12">
              <h2 className="text-3xl font-bold text-indigo-600 mb-6">えいかいわ おつかれさま！</h2>
              <div className="text-6xl mb-6">💡🗣️</div>
              <p className="text-lg font-bold text-gray-700 mb-8 leading-relaxed">ここからは 単語（たんご）を えいごで こたえる<br/>クイズだよ！<br/>ぜんぶで ４もん あるよ。</p>
              <button onClick={() => setStep('QUIZ')} className="bg-indigo-500 hover:bg-indigo-600 text-white font-bold py-4 px-12 rounded-full text-2xl shadow-md">スタート！</button>
            </div>
          </div>
        );
      } else if (step === 'QUIZ') {
        if (quizQuestions.length > 0 && currentQuizIndex < quizQuestions.length) {
          const qWord = QUIZ_WORDS[quizQuestions[currentQuizIndex]];
          content = (
            <div className="min-h-screen bg-indigo-50 p-4 flex items-center justify-center relative">
              <div className="max-w-lg w-full bg-white rounded-3xl shadow-xl p-8 text-center border-4 border-indigo-200">
                {renderHeader(`クイズ ${currentQuizIndex + 1} / 4`)}
                <div className="bg-indigo-100 p-8 rounded-2xl mb-8 shadow-inner">
                  <div className="text-6xl mb-4">{qWord.emoji}</div>
                  <p className="text-4xl font-extrabold text-indigo-700 mb-4">{qWord.ja}</p>
                  <p className="text-gray-600 font-bold text-xl">えいごで なにかな？</p>
                  <button onClick={() => speak(qWord.en)} className="mt-6 bg-white px-4 py-2 rounded-full shadow-sm text-indigo-600 font-bold flex mx-auto items-center hover:bg-indigo-50 border border-indigo-200"><span className="mr-2">🔊</span>こたえをきく (ヒント)</button>
                </div>
                <div className="mb-8">
                  <button onClick={() => startListening('QUIZ')} disabled={isListening} className={`p-6 rounded-full shadow-lg ${isListening ? 'bg-red-500 animate-pulse' : 'bg-blue-500 hover:bg-blue-600'} text-white mx-auto text-4xl transition`}>🎤</button>
                  <p className="mt-4 text-gray-600 font-bold">{isListening ? "はなしてください..." : "マイクをおして はなす"}</p>
                  
                  {feedbackMsg && (
                    <div className={`mt-6 text-lg md:text-xl font-black ${feedbackMsg.includes('Excellent') ? 'text-green-600 border-green-400 bg-green-50' : 'text-red-600 border-red-400 bg-red-50'} p-4 rounded-2xl border-4 text-left leading-relaxed shadow-lg whitespace-pre-line`}>
                      {feedbackMsg}
                    </div>
                  )}
                </div>
                {failCount >= 2 && <button onClick={() => proceedToNext('QUIZ')} className="bg-gray-300 hover:bg-gray-400 py-3 px-6 rounded-xl font-bold mx-auto text-gray-700">⏭️ スキップ</button>}
              </div>
            </div>
          );
        }
      } else if (step === 'MINIGAME_INTRO') {
        content = (
          <div className="min-h-screen bg-green-50 p-4 flex items-center justify-center relative">
            <div className="max-w-lg w-full bg-white rounded-3xl shadow-xl p-8 text-center border-4 border-green-200">
              <h2 className="text-3xl font-bold text-green-600 mb-6">コインあつめ ゲーム！</h2>
              <div className="bg-green-100 p-6 rounded-2xl mb-8">
                <div className="text-6xl mb-4 flex justify-center items-center gap-2">
                  <span>🪙</span>
                  <span className="animate-bounce">{currentStage.emoji}</span>
                </div>
                <p className="text-lg font-bold text-gray-700 leading-relaxed text-left bg-white p-4 rounded-xl shadow-sm">
                  キーボードの十字キー や、<br/>
                  がめんの ボタンを おして<br/>
                  <span className="text-blue-600">{currentStage.name}</span> を うごかそう！<br/>
                  <br/>
                  せいげんじかん 内に、<br/>
                  コイン（🪙）を たくさん あつめてね！
                </p>
              </div>
              <button onClick={() => setStep('MINIGAME')} className="bg-green-500 hover:bg-green-600 text-white font-bold py-4 px-12 rounded-full text-2xl shadow-md w-full transition transform hover:scale-105">スタート！</button>
            </div>
          </div>
        );
      } else if (step === 'MINIGAME') {
        content = (
          <MiniGame playerStage={currentStage} onFinish={(coins) => {
            setLastEarnedCoins(coins);
            const newTotal = totalCoins + coins;
            saveData(playCount + 1, newTotal, items, kummaniLevel, kummaniExp, cookedDishes);
            setStep('RESULT');
          }} />
        );
      } else if (step === 'RESULT') {
        content = (
          <div className="min-h-screen bg-yellow-50 p-4 flex items-center justify-center relative">
            <div className="max-w-lg w-full bg-white rounded-3xl shadow-xl p-8 border-4 border-yellow-200 text-center animate-fade-in-up">
              <h2 className="text-3xl font-bold text-yellow-600 mb-6">ゲーム おつかれさま！</h2>
              <div className="text-6xl mb-6">🎉</div>
              <p className="text-2xl font-bold text-gray-700 mb-4">あつめたコイン: <span className="text-yellow-500 text-4xl">{lastEarnedCoins}</span></p>
              <p className="text-lg font-bold text-gray-500 mb-4">ぜんぶで {totalCoins} コインになったよ！</p>
              
              <div className="bg-orange-100 p-4 rounded-xl border-2 border-orange-200 mb-8">
                <p className="text-orange-700 font-bold text-lg">ホームがめんで コインをつかって<br/>シャケを 買ってあげてね！</p>
              </div>
              
              <button onClick={() => setStep('HOME')} className="bg-blue-500 hover:bg-blue-600 text-white text-xl font-bold py-4 px-8 rounded-full flex items-center justify-center mx-auto shadow-md transform transition hover:scale-105 w-full">
                <span className="mr-2">🏠</span> ホームにもどる
              </button>
            </div>
          </div>
        );
      }

      return (
        <div className="min-h-screen relative font-sans touch-manipulation">
          {content}

          {worksheetData && worksheetData.answers && !['WORKSHEET_ANSWER', 'WORKSHEET_STAMP', 'WORKSHEET_CHECK', 'HOME', 'MINIGAME', 'MINIGAME_INTRO', 'RESULT', 'QUIZ_INTRO', 'QUIZ'].includes(step) && (
            <button 
              onClick={() => setShowWorksheet(true)} 
              className="fixed bottom-6 right-6 bg-yellow-400 hover:bg-yellow-500 text-yellow-900 p-4 rounded-full shadow-2xl z-40 text-3xl border-4 border-white transition transform hover:scale-110"
            >
              📑<span className="text-xs font-bold block -mt-1 text-center">ワークシート</span>
            </button>
          )}

          {showWorksheet && worksheetData && (
            <div className="fixed inset-0 bg-black/60 flex items-center justify-center z-50 p-2 md:p-4 backdrop-blur-sm animate-fade-in-up">
              <div className="bg-white rounded-3xl p-6 md:p-8 max-w-3xl w-full relative border-4 border-yellow-300 shadow-2xl bg-[url('https://www.transparenttextures.com/patterns/lined-paper-2.png')] max-h-[95vh] overflow-y-auto">
                <button 
                  onClick={() => setShowWorksheet(false)} 
                  className="absolute top-4 right-4 text-gray-500 hover:text-gray-800 text-3xl font-bold bg-gray-100 w-12 h-12 rounded-full flex items-center justify-center shadow z-10 border-2 border-gray-300"
                >
                  ✖
                </button>
                <h3 className="text-2xl font-bold text-yellow-700 mb-6 flex items-center border-b-2 border-yellow-200 pb-2"><span className="mr-2 text-3xl">📑</span> ワークシート</h3>
                
                <div className="bg-white/90 p-6 md:p-8 rounded-2xl border-4 border-blue-200 shadow-md">
                  <h4 className="font-bold text-blue-700 text-xl mb-4 bg-blue-100 px-4 py-2 rounded-lg inline-block shadow-sm">【わたしの こたえ】</h4>
                  <WorksheetLines data={worksheetData} />
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
