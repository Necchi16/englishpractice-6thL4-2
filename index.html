<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>夏休みの思い出をえいごではなそう！</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800&family=Zen+Maru+Gothic:wght@700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.23.10/babel.min.js"></script>

  <style>
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in-up {
      animation: fadeInUp 0.6s ease-out forwards;
    }
    @keyframes bounceIn {
      0% { transform: scale(0.1); opacity: 0; }
      60% { transform: scale(1.2); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }
    .animate-bounce-in {
      animation: bounceIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }
    * {
      -webkit-tap-highlight-color: transparent;
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    .font-worksheet {
      font-family: 'Nunito', 'Zen Maru Gothic', sans-serif;
      letter-spacing: 0.05em;
    }
  </style>
</head>
<body class="bg-blue-50 font-sans touch-manipulation">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useCallback, useRef, useMemo } = React;

    const MONSTERS = [
      { id: 1, name: "勇気のライオン", emoji: "🦁", color: "bg-orange-200" },
      { id: 2, name: "笑顔のドラゴン", emoji: "🐉", color: "bg-green-200" },
      { id: 3, name: "星の妖精", emoji: "🧚", color: "bg-yellow-200" },
      { id: 4, name: "幸運のユニコーン", emoji: "🦄", color: "bg-pink-200" },
      { id: 5, name: "知恵のフクロウ", emoji: "🦉", color: "bg-blue-200" },
      { id: 6, name: "元気なウサギ", emoji: "🐰", color: "bg-red-200" },
      { id: 7, name: "仲良しキツネ", emoji: "🦊", color: "bg-orange-300" },
      { id: 8, name: "のんびりパンダ", emoji: "🐼", color: "bg-gray-200" },
      { id: 9, name: "優しいコアラ", emoji: "🐨", color: "bg-gray-300" },
      { id: 10, name: "希望のトラ", emoji: "🐯", color: "bg-yellow-300" }
    ];

    // 夏休みにしたことのアクションリスト（この4つを順番に行う）
    const ACTIONS = [
      { id: 'ate', name: 'ate', ja: '食べた', particle: 'を', emoji: '🍽️', prompt: 'なにを食べた？', placeholder: '例: かき氷、すいか' },
      { id: 'saw', name: 'saw', ja: '見た', particle: 'を', emoji: '👀', prompt: 'なにを見た？', placeholder: '例: 花火、ひまわり' },
      { id: 'went_to', name: 'went to', ja: '行った', particle: 'に', emoji: '🚶‍♂️', prompt: 'どこに行ってきた？', placeholder: '例: 海、おばあちゃんち' },
      { id: 'enjoyed', name: 'enjoyed', ja: '楽しんだ', particle: 'を', emoji: '😊', prompt: 'なにを楽しんだ？', placeholder: '例: お祭り、キャンプ' }
    ];

    // 感想のリスト
    const ADJECTIVES = [
      { id: 'same', name: 'same', ja: '同じ', emoji: '🟰' },
      { id: 'different', name: 'different', ja: '違う', emoji: '🙅' },
      { id: 'long', name: 'long', ja: '長い', emoji: '📏' },
      { id: 'short', name: 'short', ja: '短い', emoji: '🤏' },
      { id: 'fast', name: 'fast', ja: '速い', emoji: '💨' },
      { id: 'slow', name: 'slow', ja: '遅い', emoji: '🐢' },
      { id: 'amazing', name: 'amazing', ja: '驚くべき', emoji: '😲' },
      { id: 'beautiful', name: 'beautiful', ja: '美しい', emoji: '✨' },
      { id: 'cool', name: 'cool', ja: 'かっこいい', emoji: '😎' },
      { id: 'exciting', name: 'exciting', ja: 'ワクワクする', emoji: '🤩' },
      { id: 'famous', name: 'famous', ja: '有名な', emoji: '🌟' },
      { id: 'fantastic', name: 'fantastic', ja: 'すばらしい', emoji: '🎉' },
      { id: 'favorite', name: 'favorite', ja: 'お気に入り', emoji: '💖' },
      { id: 'fun', name: 'fun', ja: '楽しい', emoji: '😆' },
      { id: 'good', name: 'good', ja: '良い', emoji: '👍' },
      { id: 'great', name: 'great', ja: 'すごく良い', emoji: '🙌' },
      { id: 'interesting', name: 'interesting', ja: 'おもしろい', emoji: '🤔' },
      { id: 'nice', name: 'nice', ja: 'すてきな', emoji: '😊' },
      { id: 'shiny', name: 'shiny', ja: 'ピカピカの', emoji: '✨' },
      { id: 'wonderful', name: 'wonderful', ja: 'すばらしい', emoji: '🌈' }
    ];

    const COM_ANSWERS = {
      default: { en: "That sounds like a wonderful memory!", ja: "それはすばらしい思い出ですね！" }
    };

    const DISHES = [
      "タケノコとサツマイモの ホクホクおみそしる",
      "秋の あまから きんぴら",
      "もっちり サツマイモと タケノコの 天ぷら",
      "タケノコ入り サツマイモ コロッケ",
      "魔法の ぜっぴん スイートポテト・タケノコぞえ"
    ];

    function MiniGame({ monsters, onFinish }) {
      const [timeLeft, setTimeLeft] = useState(10);
      const [coins, setCoins] = useState(0);
      
      const initialPositions = useMemo(() => {
        return monsters.map((m) => ({
          id: m.id,
          emoji: m.emoji,
          x: 50 + (Math.random() * 40 - 20),
          y: 50 + (Math.random() * 40 - 20)
        }));
      }, [monsters]);

      const [playerPositions, setPlayerPositions] = useState(initialPositions);
      const [coinPos, setCoinPos] = useState({x: Math.random() * 80 + 10, y: Math.random() * 80 + 10});
      
      const playersRef = useRef(initialPositions);
      const coinRef = useRef({x: coinPos.x, y: coinPos.y});
      const keysRef = useRef({ArrowUp: false, ArrowDown: false, ArrowLeft: false, ArrowRight: false});
      const requestRef = useRef();
      const isFinished = useRef(false);

      useEffect(() => {
        const timer = setInterval(() => {
          setTimeLeft(prev => {
            if (prev <= 1) {
              clearInterval(timer);
              return 0;
            }
            return prev - 1;
          });
        }, 1000);
        return () => clearInterval(timer);
      }, []);

      useEffect(() => {
        if (timeLeft === 0 && !isFinished.current) {
          isFinished.current = true;
          cancelAnimationFrame(requestRef.current);
          onFinish(coins);
        }
      }, [timeLeft, coins, onFinish]);

      useEffect(() => {
        const handleKeyDown = (e) => {
          if (keysRef.current.hasOwnProperty(e.key)) {
            keysRef.current[e.key] = true;
            e.preventDefault();
          }
        };
        const handleKeyUp = (e) => {
          if (keysRef.current.hasOwnProperty(e.key)) {
            keysRef.current[e.key] = false;
            e.preventDefault();
          }
        };
        window.addEventListener('keydown', handleKeyDown, {passive: false});
        window.addEventListener('keyup', handleKeyUp);
        return () => {
          window.removeEventListener('keydown', handleKeyDown);
          window.removeEventListener('keyup', handleKeyUp);
        };
      }, []);

      useEffect(() => {
        const updateGame = () => {
          if (timeLeft <= 0) return;

          const speed = 1.5;
          let dx = 0;
          let dy = 0;

          if (keysRef.current.ArrowUp) dy -= speed;
          if (keysRef.current.ArrowDown) dy += speed;
          if (keysRef.current.ArrowLeft) dx -= speed;
          if (keysRef.current.ArrowRight) dx += speed;

          const newPositions = playersRef.current.map(p => {
            let px = p.x + dx;
            let py = p.y + dy;
            px = Math.max(5, Math.min(95, px));
            py = Math.max(5, Math.min(95, py));
            return { ...p, x: px, y: py };
          });

          playersRef.current = newPositions;
          setPlayerPositions(newPositions);

          const cx = coinRef.current.x;
          const cy = coinRef.current.y;
          const hit = newPositions.some(p => Math.hypot(p.x - cx, p.y - cy) < 12);
          
          if (hit) { 
            setCoins(c => c + 1);
            coinRef.current = {
              x: Math.random() * 80 + 10,
              y: Math.random() * 80 + 10
            };
            setCoinPos({...coinRef.current});
          }

          requestRef.current = requestAnimationFrame(updateGame);
        };
        requestRef.current = requestAnimationFrame(updateGame);
        return () => cancelAnimationFrame(requestRef.current);
      }, [timeLeft]);

      const handlePointer = (dir, isDown) => {
        keysRef.current[dir] = isDown;
      };

      return (
        <div className="min-h-screen bg-green-50 p-4 md:p-8 flex flex-col items-center justify-center">
          <div className="max-w-lg w-full bg-white rounded-3xl shadow-xl p-4 md:p-8 border-4 border-green-200">
            <h2 className="text-2xl font-bold text-center text-green-700 mb-4">コインをあつめよう！</h2>
            <div className="flex justify-between items-center mb-4 px-2">
              <div className="text-2xl font-bold text-gray-700">⏳ {timeLeft}びょう</div>
              <div className="text-2xl font-bold text-yellow-500">🪙 {coins} コイン</div>
            </div>
            
            <div className="relative w-full h-80 bg-green-100 rounded-xl overflow-hidden border-2 border-green-300">
              {playerPositions.map((p, index) => (
                <div 
                  key={p.id + '-' + index}
                  className="absolute text-5xl transform -translate-x-1/2 -translate-y-1/2 drop-shadow-md z-10"
                  style={{ left: `${p.x}%`, top: `${p.y}%` }}
                >
                  {p.emoji}
                </div>
              ))}
              <div 
                className="absolute text-4xl transform -translate-x-1/2 -translate-y-1/2 drop-shadow-md animate-bounce"
                style={{ left: `${coinPos.x}%`, top: `${coinPos.y}%` }}
              >
                🪙
              </div>
            </div>

            <div className="grid grid-cols-3 gap-2 w-48 mx-auto mt-6 touch-none">
              <div />
              <button 
                className="bg-gray-200 active:bg-gray-400 p-4 rounded-xl text-2xl shadow select-none flex items-center justify-center"
                onPointerDown={() => handlePointer('ArrowUp', true)}
                onPointerUp={() => handlePointer('ArrowUp', false)}
                onPointerLeave={() => handlePointer('ArrowUp', false)}
              >⬆️</button>
              <div />
              <button 
                className="bg-gray-200 active:bg-gray-400 p-4 rounded-xl text-2xl shadow select-none flex items-center justify-center"
                onPointerDown={() => handlePointer('ArrowLeft', true)}
                onPointerUp={() => handlePointer('ArrowLeft', false)}
                onPointerLeave={() => handlePointer('ArrowLeft', false)}
              >⬅️</button>
              <button 
                className="bg-gray-200 active:bg-gray-400 p-4 rounded-xl text-2xl shadow select-none flex items-center justify-center"
                onPointerDown={() => handlePointer('ArrowDown', true)}
                onPointerUp={() => handlePointer('ArrowDown', false)}
                onPointerLeave={() => handlePointer('ArrowDown', false)}
              >⬇️</button>
              <button 
                className="bg-gray-200 active:bg-gray-400 p-4 rounded-xl text-2xl shadow select-none flex items-center justify-center"
                onPointerDown={() => handlePointer('ArrowRight', true)}
                onPointerUp={() => handlePointer('ArrowRight', false)}
                onPointerLeave={() => handlePointer('ArrowRight', false)}
              >➡️</button>
            </div>
            
            <p className="text-center text-gray-500 mt-4 text-sm font-bold">じゅうじキーでも うごかせるよ</p>
          </div>
        </div>
      );
    }

    function App() {
      const [step, setStep] = useState('HOME'); 
      const [playCount, setPlayCount] = useState(0);
      const [collections, setCollections] = useState([]);
      const [totalCoins, setTotalCoins] = useState(0);
      const [items, setItems] = useState({ takenoko: 0, satsumaimo: 0 });
      const [cookedDishes, setCookedDishes] = useState([]);

      // 4つの回答を保持する配列ステート
      const [currentActionIndex, setCurrentActionIndex] = useState(0);
      const [myAnswers, setMyAnswers] = useState(
        ACTIONS.map(act => ({ action: act, object: null, adjective: null }))
      );
      
      const [inputObjectText, setInputObjectText] = useState("");
      const [inputAdjectiveText, setInputAdjectiveText] = useState("");
      const [isTranslating, setIsTranslating] = useState(false);

      // ★ここにGASでデプロイしたWebアプリのURLを設定してください
      const GAS_TRANSLATE_URL = "https://script.google.com/macros/s/AKfycbweESd0ikrHJl6Pl5lPnniXgoUWW45_YDUIAXuCBYKkclBs3T47GX83B5q-GAc8Hw3sPQ/exec";

      const translateToEn = async (jaText, type = 'object') => {
        try {
          const res = await fetch(`${GAS_TRANSLATE_URL}?text=${encodeURIComponent(jaText)}`);
          const data = await res.json();
          let enText = data.text.replace(/[\.\,\!]/g, '');
          
          if (type === 'object') {
            enText = enText.toLowerCase();
            // 翻訳結果の先頭の不要な動詞等をカット
            enText = enText.replace(/^i went to /, '').replace(/^i ate /, '').replace(/^i saw /, '').replace(/^i enjoyed /, '').trim();
          } else if (type === 'adjective') {
            enText = enText.toLowerCase();
            enText = enText.replace(/^it is /, '').replace(/^it was /, '').replace(/^a /, '').replace(/^an /, '').replace(/^the /, '').trim();
          }
          return enText;
        } catch(e) {
          console.error("Translation error", e);
          if(type === 'object') return "something";
          if(type === 'adjective') return "nice";
          return "something"; 
        }
      };

      // フォームの入力内容を復元する
      useEffect(() => {
        if (step === 'MY_INPUT_ANSWER') {
          const currentAnswer = myAnswers[currentActionIndex];
          setInputObjectText(currentAnswer && currentAnswer.object ? currentAnswer.object.ja : "");
          setInputAdjectiveText(currentAnswer && currentAnswer.adjective ? currentAnswer.adjective.ja : "");
        }
      }, [currentActionIndex, step, myAnswers]);

      const handleDecide = async () => {
        const currentAction = ACTIONS[currentActionIndex];
        if (!inputObjectText.trim() || !inputAdjectiveText.trim()) {
          alert(`「${currentAction.prompt}」の答えと「感想」をすべて入力してね！`);
          return;
        }
        setIsTranslating(true);
        
        // 1. Object（名詞）の処理
        const enObjectText = await translateToEn(inputObjectText.trim(), 'object');
        const finalObject = { name: enObjectText, ja: inputObjectText.trim() };

        // 2. 形容詞の処理
        let finalAdjective = null;
        const foundAdj = ADJECTIVES.find(a => a.ja === inputAdjectiveText.trim());
        if (foundAdj) {
          finalAdjective = foundAdj;
        } else {
          const enAdjText = await translateToEn(inputAdjectiveText.trim(), 'adjective');
          finalAdjective = { id: 'custom_adj', name: enAdjText, ja: inputAdjectiveText.trim(), emoji: '✨' };
        }

        // 状態の更新
        const newAnswers = [...myAnswers];
        newAnswers[currentActionIndex] = {
          action: currentAction,
          object: finalObject,
          adjective: finalAdjective
        };
        setMyAnswers(newAnswers);

        setIsTranslating(false);
        setStep('MY_SPEAK_ANSWER');
        setFailCount(0);
      };

      const [worksheetData, setWorksheetData] = useState(null);
      const [showWorksheet, setShowWorksheet] = useState(false);

      const [quizQuestions, setQuizQuestions] = useState([]);
      const [currentQuizIndex, setCurrentQuizIndex] = useState(0);
      
      const [failCount, setFailCount] = useState(0);
      const [isListening, setIsListening] = useState(false);
      const [feedbackMsg, setFeedbackMsg] = useState("");
      
      const [currentGachaMonster, setCurrentGachaMonster] = useState(null);
      const [isRolling, setIsRolling] = useState(false);
      const [rollEmoji, setRollEmoji] = useState("🎁");
      const [lastEarnedCoins, setLastEarnedCoins] = useState(0);

      const [purchaseEffect, setPurchaseEffect] = useState(null);
      const [cookEffect, setCookEffect] = useState(null);

      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      const synth = window.speechSynthesis;

      useEffect(() => {
        const savedCount = localStorage.getItem('englishAppPlayCount_Summer');
        if (savedCount) setPlayCount(parseInt(savedCount, 10));
        const savedCollections = localStorage.getItem('englishAppCollections_Summer');
        if (savedCollections) setCollections(JSON.parse(savedCollections));
        const savedCoins = localStorage.getItem('englishAppCoins_Summer');
        if (savedCoins) setTotalCoins(parseInt(savedCoins, 10));
        const savedItems = localStorage.getItem('englishAppItems_Summer');
        if (savedItems) setItems(JSON.parse(savedItems));
        const savedDishes = localStorage.getItem('englishAppDishes_Summer');
        if (savedDishes) setCookedDishes(JSON.parse(savedDishes));
        
        const savedWorksheet = localStorage.getItem('englishAppWorksheet_Summer');
        if (savedWorksheet) {
          try {
            const parsed = JSON.parse(savedWorksheet);
            if (Array.isArray(parsed)) {
              setWorksheetData(parsed);
            } else {
              setWorksheetData([parsed]); // 後方互換性
            }
          } catch (e) {
            console.error("Failed to load worksheet data", e);
          }
        }
      }, []);

      const formatPeriod = (text) => text.replace(/\.+$/, '.');

      const saveData = (newCount, newCollections, newCoins, newItems, newDishes) => {
        localStorage.setItem('englishAppPlayCount_Summer', newCount.toString());
        localStorage.setItem('englishAppCollections_Summer', JSON.stringify(newCollections));
        localStorage.setItem('englishAppCoins_Summer', newCoins.toString());
        if(newItems) localStorage.setItem('englishAppItems_Summer', JSON.stringify(newItems));
        if(newDishes) localStorage.setItem('englishAppDishes_Summer', JSON.stringify(newDishes));
        
        setPlayCount(newCount);
        setCollections(newCollections);
        setTotalCoins(newCoins);
        if(newItems) setItems(newItems);
        if(newDishes) setCookedDishes(newDishes);
      };

      const getComAskTexts = () => {
        return { 
          text: "Please tell me about your summer vacation.", 
          jpText: "夏休みの思い出について おしえてください。" 
        };
      };

      const getCurrentAnswerTexts = (ans) => {
        if(!ans || !ans.object || !ans.adjective) return { en: "", ja: "" };
        const en = formatPeriod(`I ${ans.action.name} ${ans.object.name}. It was ${ans.adjective.name}.`);
        const ja = `私は夏休みに${ans.object.ja}${ans.action.particle}${ans.action.ja}。それは${ans.adjective.ja}だった。`;
        return { en, ja };
      };

      const AnswerTextWithHighlight = ({ isEn, data }) => {
        if (!data || !data.object || !data.adjective) return null;
        
        const { action, object, adjective: adj } = data;

        const highlightClass = "font-bold px-1 rounded mx-1 shadow-sm inline-block";
        const actionClass = `${highlightClass} text-blue-700 bg-blue-100 border border-blue-200`;
        const objectClass = `${highlightClass} text-green-700 bg-green-100 border border-green-200`;
        const adjClass = `${highlightClass} text-yellow-700 bg-yellow-100 border border-yellow-200`;

        if (isEn) {
          return (
            <span>
              I <span className={actionClass}>{action.name}</span> <span className={objectClass}>{object.name}</span>.<br/>
              It was <span className={adjClass}>{adj.name}</span>.
            </span>
          );
        } else {
          return (
            <span>
              私は夏休みに<span className={objectClass}>{object.ja}</span>{action.particle}<span className={actionClass}>{action.ja}</span>。<br/>
              それは<span className={adjClass}>{adj.ja}</span>だった。
            </span>
          );
        }
      };

      const saveWorksheet = () => {
        localStorage.setItem('englishAppWorksheet_Summer', JSON.stringify(myAnswers));
        setWorksheetData(myAnswers);
      };

      const startApp = () => {
        setFailCount(0);
        setCurrentActionIndex(0);
        setMyAnswers(ACTIONS.map(act => ({ action: act, object: null, adjective: null })));
        setStep('COM_ASK');
      };

      const buyItem = (itemType, cost) => {
        if (totalCoins >= cost) {
          const newCoins = totalCoins - cost;
          const newItems = { ...items, [itemType]: items[itemType] + 1 };
          saveData(playCount, collections, newCoins, newItems, cookedDishes);
          
          setPurchaseEffect(itemType);
          setTimeout(() => setPurchaseEffect(null), 1500);
        } else {
          alert("コインがたりないよ！ミニゲームであつめてね。");
        }
      };

      const cookDish = () => {
        if (items.takenoko >= 1 && items.satsumaimo >= 1) {
          const newItems = { takenoko: items.takenoko - 1, satsumaimo: items.satsumaimo - 1 };
          setItems(newItems);
          saveData(playCount, collections, totalCoins, newItems, cookedDishes);

          setCookEffect('cooking');
          setTimeout(() => {
            const unownedDishes = DISHES.filter(d => !cookedDishes.includes(d));
            const newDish = unownedDishes.length > 0 ? unownedDishes[Math.floor(Math.random() * unownedDishes.length)] : DISHES[Math.floor(Math.random() * DISHES.length)];
            
            setCookEffect(newDish);
            
            if (!cookedDishes.includes(newDish)) {
              const newDishes = [...cookedDishes, newDish];
              setCookedDishes(newDishes);
              saveData(playCount, collections, totalCoins, newItems, newDishes);
            }
          }, 2000);
        }
      };

      const handleBack = () => {
        setFailCount(0);
        setFeedbackMsg("");
        setIsListening(false);
        
        switch(step) {
          case 'COM_ASK': 
            setStep('HOME'); 
            break;
          case 'MY_INPUT_ANSWER': 
            if (currentActionIndex > 0) {
              setCurrentActionIndex(prev => prev - 1);
              setStep('MY_SPEAK_ANSWER');
            } else {
              setStep('COM_ASK');
            }
            break;
          case 'MY_SPEAK_ANSWER': 
            setStep('MY_INPUT_ANSWER'); 
            break;
          case 'WORKSHEET_ANSWER': 
            setCurrentActionIndex(ACTIONS.length - 1);
            setStep('MY_SPEAK_ANSWER'); 
            break;
          case 'COM_ANSWER': 
            setStep('WORKSHEET_ANSWER'); 
            break;
          case 'WORKSHEET_CHECK': 
            setStep('COM_ANSWER'); 
            break;
          case 'WORKSHEET_STAMP': 
            setStep('WORKSHEET_CHECK'); 
            break;
          case 'QUIZ_INTRO': 
            setStep('WORKSHEET_STAMP');

        if (synth.speaking) synth.cancel();
        const utterThis = new SpeechSynthesisUtterance(text);
        utterThis.lang = 'en-US';
        utterThis.rate = rate; 
        const voices = synth.getVoices();
        const englishVoice = voices.find(v => v.lang.includes('en-US') && v.name.includes('Female')) || voices.find(v => v.lang.includes('en-US'));
        if (englishVoice) utterThis.voice = englishVoice;
        synth.speak(utterThis);
      }, [synth]);

      useEffect(() => {
        if (step === 'COM_ASK') {
          const { text } = getComAskTexts();
          setTimeout(() => speak(text), 500);
        } else if (step === 'COM_ANSWER') {
          setTimeout(() => speak(COM_ANSWERS.default.en), 500);
        }
      }, [step, speak]);

      const prepareQuiz = () => {
        const q = [];
        while(q.length < 4) {
          const r = Math.floor(Math.random() * ADJECTIVES.length);
          if(!q.includes(r)) q.push(r);
        }
        setQuizQuestions(q);
        setCurrentQuizIndex(0);

      const startListening = (targetType) => {
        if (!SpeechRecognition) {
          alert("お使いのブラウザは音声入力に対応していません。スキップして進んでください。");
          setFailCount(2); 
          return;

        const recognition = new SpeechRecognition();
        recognition.lang = 'en-US';
        recognition.interimResults = false;
        recognition.maxAlternatives = 1;

        setIsListening(true);
        setFeedbackMsg("");

        recognition.onresult = (event) => {
          const transcript = event.results[0][0].transcript.toLowerCase();
          checkPronunciation(transcript, targetType);
        };
        recognition.onerror = () => {
          setIsListening(false);
          handleFail();
        };
        recognition.onend = () => setIsListening(false);
        recognition.start();
      };

      const handleFail = () => {
        setFailCount(prev => prev + 1);
        setFeedbackMsg("おしい！もういちどチャレンジ！\nマイクの場所はどこか確認をしよう。\n分からない人は先生を呼ぼう。\n自分の声がうまく入らない場合はイヤホンをとってやってみよう。");

      const checkPronunciation = (transcript, targetType) => {
        let isCorrect = false;
        const trans = transcript.toLowerCase();
        
        if (targetType === 'MY_ANSWER') {
          const currentAnswer = myAnswers[currentActionIndex];
          const hasAction = trans.includes(currentAnswer.action.name.toLowerCase());
          
          const objWords = currentAnswer.object.name.toLowerCase().split(' ').filter(w => w.length > 2);
          const hasObject = objWords.length > 0 ? objWords.some(w => trans.includes(w)) : trans.includes(currentAnswer.object.name.toLowerCase());
          const hasAdjective = trans.includes(currentAnswer.adjective.name.toLowerCase());
          
          isCorrect = (hasAction && hasAdjective) || (hasAction && hasObject) || (hasObject && hasAdjective);
          if (!isCorrect && trans.length > 10) isCorrect = true; // 救済処置
        } 
        else if (targetType === 'QUIZ') {
          if (quizQuestions.length > 0 && currentQuizIndex < quizQuestions.length) {
            const qAdj = ADJECTIVES[quizQuestions[currentQuizIndex]];
            isCorrect = trans.includes(qAdj.name.toLowerCase());
          }
        }

        if (isCorrect) {
          setFeedbackMsg("Excellent! 👏");
          setTimeout(() => speak("Excellent!"), 500);
          setTimeout(() => proceedToNext(targetType), 2000);
        } else {
          handleFail();
        }
      };

      const proceedToNext = (fromType) => {

        }
      };

          <div className="min-h-screen bg-yellow-50 p-4 flex items-center justify-center relative">
            <BackButton />
            <div className="max-w-md w-full bg-white rounded-3xl shadow-xl p-8 border-4 border-yellow-200 text-center mt-12">
              <div className="text-6xl mb-6">📑</div>
              <h2 className="text-2xl font-bold text-gray-800 mb-8 leading-relaxed">もう ワークシートは<br/>ぜんぶ 書いたかな？</h2>
              
              <div className="flex flex-col gap-4">
                <button 
                  onClick={prepareQuiz} 
                  className="w-full bg-green-500 hover:bg-green-600 text-white text-xl font-bold py-4 rounded-xl shadow-md"
                >
                  はい（つぎへすすむ）
                </button>
                <button 
                  onClick={() => setStep('WORKSHEET_STAMP')} 
                  className="w-full bg-yellow-500 hover:bg-yellow-600 text-white text-xl font-bold py-4 rounded-xl shadow-md"
                >
                  いいえ（ワークシートを見る）
                </button>
              </div>
            </div>
          </div>
        );
      } else if (step === 'WORKSHEET_STAMP') {
        const displayData = worksheetData || myAnswers;
        const { text: qText } = getComAskTexts();

        content = (
          <div className="min-h-screen bg-yellow-50 p-4 flex items-center justify-center relative">
            <BackButton />
            <div className="max-w-2xl w-full bg-white rounded-3xl shadow-xl p-6 md:p-8 border-4 border-yellow-200 mt-12 max-h-[90vh] overflow-y-auto">
              <div className="flex items-center justify-center text-yellow-600 mb-6 border-b-4 border-yellow-100 pb-4">
                <span className="mr-4 text-4xl">💮</span><h2 className="text-3xl font-bold">ワークシート かんせい！</h2>
              </div>
              
              <div className="bg-white border-2 border-gray-300 p-6 rounded-lg shadow-inner bg-[url('https://www.transparenttextures.com/patterns/lined-paper-2.png')] mb-8">
                <h3 className="font-bold text-xl text-blue-600 mb-4 bg-blue-100 inline-block px-3 py-1 rounded shadow-sm">【わたしの こたえ】</h3>
                <div className="text-xl md:text-2xl font-worksheet text-gray-800 leading-loose mb-4 pb-4 text-left space-y-6">
                  <span className="text-gray-500 text-xs font-bold block mb-2 bg-gray-100 p-1 rounded inline-block font-sans shadow-sm">
                    Q: {qText}
                  </span>
                  {displayData.map((ans, idx) => (
                    <div key={idx} className="border-b-2 border-dashed border-gray-400 pb-4">
                      <div className="my-2"><AnswerTextWithHighlight isEn={true} data={ans} /></div>
                      <span className="text-sm text-gray-500 font-bold block mt-3 bg-white/50 p-2 rounded border border-gray-200">
                        <AnswerTextWithHighlight isEn={false} data={ans} />
                      </span>
                    </div>
                  ))}
                </div>
              </div>
              
              <div className="bg-red-50 p-6 rounded-xl border border-red-200 text-center mb-8 shadow-md">
                <p className="text-red-700 font-bold text-xl mb-3">先生を よんで スタンプを もらいましょう！</p>
                <p className="text-gray-700 font-bold text-lg">スタンプを もらったら、下のボタンを おしてね。</p>
              </div>
              <button onClick={prepareQuiz} className="w-full bg-yellow-500 hover:bg-yellow-600 text-white text-2xl font-bold py-5 rounded-xl flex items-center justify-center shadow-lg transform transition hover:scale-105"><span className="mr-3 text-3xl">💮</span> スタンプをもらった！</button>
            </div>
          </div>
        );
      } else if (step === 'QUIZ_INTRO') {
        content = (
          <div className="min-h-screen bg-indigo-50 p-4 flex items-center justify-center relative">
            <BackButton />
            <div className="max-w-lg w-full bg-white rounded-3xl shadow-xl p-8 text-center border-4 border-indigo-200 mt-12">
              <h2 className="text-3xl font-bold text-indigo-600 mb-6">えいかいわ おつかれさま！</h2>
              <div className="text-6xl mb-6">🌟📝</div>
              <p className="text-lg font-bold text-gray-700 mb-8 leading-relaxed">ここからは「感想」を えいごで こたえる<br/>クイズだよ！<br/>ぜんぶで ４もん あるよ。</p>
              <button onClick={() => setStep('QUIZ')} className="bg-indigo-500 hover:bg-indigo-600 text-white font-bold py-4 px-12 rounded-full text-2xl shadow-md">スタート！</button>
            </div>
          </div>
        );
      } else if (step === 'QUIZ') {
        if (quizQuestions.length > 0 && currentQuizIndex < quizQuestions.length) {
          const qAdj = ADJECTIVES[quizQuestions[currentQuizIndex]];
          content = (
            <div className="min-h-screen bg-indigo-50 p-4 flex items-center justify-center relative">
              <div className="max-w-lg w-full bg-white rounded-3xl shadow-xl p-8 text-center border-4 border-indigo-200">
                {renderHeader(`クイズ ${currentQuizIndex + 1} / 4`)}
                <div className="bg-indigo-100 p-8 rounded-2xl mb-8 shadow-inner">
                  <div className="text-6xl mb-4">{qAdj.emoji}</div>
                  <p className="text-4xl font-extrabold text-indigo-700 mb-4">{qAdj.ja}</p>
                  <p className="text-gray-600 font-bold text-xl">えいごで なにかな？</p>
                  <button onClick={() => speak(qAdj.name)} className="mt-6 bg-white px-4 py-2 rounded-full shadow-sm text-indigo-600 font-bold flex mx-auto items-center hover:bg-indigo-50 border border-indigo-200"><span className="mr-2">🔊</span>こたえをきく (ヒント)</button>
                </div>
                <div className="mb-8">
                  <button onClick={() => startListening('QUIZ')} disabled={isListening} className={`p-6 rounded-full shadow-lg ${isListening ? 'bg-red-500 animate-pulse' : 'bg-blue-500 hover:bg-blue-600'} text-white mx-auto text-4xl transition`}>🎤</button>
                  <p className="mt-4 text-gray-600 font-bold">{isListening ? "はなしてください..." : "マイクをおして はなす"}</p>
                  
                  {feedbackMsg && (
                    <div className={`mt-6 text-lg md:text-xl font-black ${feedbackMsg.includes('Excellent') ? 'text-green-600 border-green-400 bg-green-50' : 'text-red-600 border-red-400 bg-red-50'} p-4 rounded-2xl border-4 text-left leading-relaxed shadow-lg whitespace-pre-line`}>
                      {feedbackMsg}
                    </div>
                  )}
                </div>
                {failCount >= 2 && <button onClick={() => proceedToNext('QUIZ')} className="bg-gray-300 hover:bg-gray-400 py-3 px-6 rounded-xl font-bold mx-auto text-gray-700">⏭️ スキップ</button>}
              </div>
            </div>
          );
        }
      } else if (step === 'GACHA') {
        content = (
          <div className="min-h-screen bg-indigo-900 p-4 flex items-center justify-center relative overflow-hidden">
            <div className="absolute inset-0 opacity-50 bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-indigo-700 via-indigo-900 to-black"></div>
            <div className="max-w-lg w-full bg-white/10 backdrop-blur-md rounded-3xl shadow-2xl p-8 text-center relative z-10 border border-white/20">
              <h2 className="text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-yellow-300 to-yellow-500 mb-8">おたのしみ ガチャ！</h2>
              {!currentGachaMonster ? (
                <div className="mb-12">
                  {isRolling ? (
                    <div className="flex flex-col items-center justify-center">
                      <p className="text-yellow-300 font-bold text-2xl mb-8 animate-pulse">なにがでるかな...？</p>
                      <div className="w-48 h-48 mx-auto bg-white rounded-full flex items-center justify-center mb-8 border-4 border-yellow-300 scale-110 shadow-[0_0_50px_rgba(253,224,71,0.6)]">
                        <span className="text-8xl">{rollEmoji}</span>
                      </div>
                    </div>
                  ) : (
                    <>
                      <div className="w-48 h-48 mx-auto bg-gradient-to-br from-purple-500 to-pink-500 rounded-full flex items-center justify-center animate-bounce mb-8 shadow-[0_0_30px_rgba(236,72,153,0.5)]">
                        <span className="text-7xl">🎁</span>
                      </div>
                      <button onClick={rollGacha} className="bg-gradient-to-r from-yellow-400 to-orange-500 text-white text-3xl font-black py-5 px-12 rounded-full border-4 border-yellow-200 shadow-2xl hover:scale-105 transform transition">ガチャを まわす！</button>
                    </>
                  )}
                </div>
              ) : (
                <div className="mb-8 animate-fade-in-up">
                  <p className="text-yellow-300 font-bold text-xl mb-4">ゲットした モンスターは…</p>
                  <div className={`${currentGachaMonster.color} w-64 h-64 mx-auto rounded-full flex items-center justify-center mb-6 border-8 border-white shadow-[0_0_40px_rgba(255,255,255,0.3)]`}>
                    <span className="text-8xl mb-2">{currentGachaMonster.emoji}</span>
                  </div>
                  <h3 className="text-4xl font-extrabold text-white mb-8 drop-shadow">{currentGachaMonster.name}</h3>
                  <button onClick={() => setStep('MINIGAME_INTRO')} className="bg-yellow-500 hover:bg-yellow-600 text-white text-2xl font-bold py-4 px-8 rounded-full shadow-lg w-full transform transition hover:scale-105">つぎへ！</button>
                </div>
              )}
            </div>
          </div>
        );
      } else if (step === 'MINIGAME_INTRO') {
        content = (
          <div className="min-h-screen bg-green-50 p-4 flex items-center justify-center relative">
            <div className="max-w-lg w-full bg-white rounded-3xl shadow-xl p-8 text-center border-4 border-green-200">
              <h2 className="text-3xl font-bold text-green-600 mb-6">コインあつめ ゲーム！</h2>
              <div className="bg-green-100 p-6 rounded-2xl mb-8">
                <div className="text-6xl mb-4">🪙🏃‍♂️</div>
                <p className="text-lg font-bold text-gray-700 leading-relaxed text-left">
                  キーボードの <span className="bg-white px-2 py-1 rounded shadow-sm border">↑</span> <span className="bg-white px-2 py-1 rounded shadow-sm border">↓</span> <span className="bg-white px-2 py-1 rounded shadow-sm border">←</span> <span className="bg-white px-2 py-1 rounded shadow-sm border">→</span> や、<br/>
                  がめんの ボタンを おして<br/>
                  モンスターを うごかそう！<br/>
                  <br/>
                  せいげんじかん 内に、<br/>
                  コイン（🪙）を たくさん あつめてね！
                </p>
              </div>
              <button onClick={() => setStep('MINIGAME')} className="bg-green-500 hover:bg-green-600 text-white font-bold py-4 px-12 rounded-full text-2xl shadow-md w-full transition transform hover:scale-105">スタート！</button>
            </div>
          </div>
        );
      } else if (step === 'MINIGAME') {
        const gameMonsters = collections.length > 0 ? collections : (currentGachaMonster ? [currentGachaMonster] : []);
        content = (
          <MiniGame monsters={gameMonsters} onFinish={(coins) => {
            setLastEarnedCoins(coins);
            const newTotal = totalCoins + coins;
            saveData(playCount, collections, newTotal, items, cookedDishes);
            setStep('RESULT');
          }} />
        );
      } else if (step === 'RESULT') {
        content = (
          <div className="min-h-screen bg-yellow-50 p-4 flex items-center justify-center relative">
            <div className="max-w-lg w-full bg-white rounded-3xl shadow-xl p-8 border-4 border-yellow-200 text-center animate-fade-in-up">
              <h2 className="text-3xl font-bold text-yellow-600 mb-6">ゲーム おつかれさま！</h2>
              <div className="text-6xl mb-6">🎉</div>
              <p className="text-2xl font-bold text-gray-700 mb-4">あつめたコイン: <span className="text-yellow-500 text-4xl">{lastEarnedCoins}</span></p>
              <p className="text-lg font-bold text-gray-500 mb-4">ぜんぶで {totalCoins} コインになったよ！</p>
              
              <div className="bg-orange-100 p-4 rounded-xl border-2 border-orange-200 mb-8">
                <p className="text-orange-700 font-bold text-lg">ホームがめんで コインをつかって<br/>タケノコや さつまいもを かってみよう！</p>
              </div>
              
              <button onClick={() => { setCurrentGachaMonster(null); setStep('HOME'); }} className="bg-blue-500 hover:bg-blue-600 text-white text-xl font-bold py-4 px-8 rounded-full flex items-center justify-center mx-auto shadow-md transform transition hover:scale-105 w-full">
                <span className="mr-2">🏠</span> ホームにもどる
              </button>
            </div>
          </div>
        );
      }

      return (
        <div className="min-h-screen relative font-sans touch-manipulation">
          {content}

          {worksheetData && !['WORKSHEET_ANSWER', 'WORKSHEET_STAMP', 'WORKSHEET_CHECK', 'HOME', 'MINIGAME', 'MINIGAME_INTRO', 'RESULT', 'GACHA'].includes(step) && (
            <button 
              onClick={() => setShowWorksheet(true)} 
              className="fixed bottom-6 right-6 bg-yellow-400 hover:bg-yellow-500 text-yellow-900 p-4 rounded-full shadow-2xl z-40 text-3xl border-4 border-white transition transform hover:scale-110"
            >
              📑<span className="text-xs font-bold block -mt-1 text-center">ワークシート</span>
            </button>
          )}

          {showWorksheet && worksheetData && (
            <div className="fixed inset-0 bg-black/60 flex items-center justify-center z-50 p-2 md:p-4 backdrop-blur-sm animate-fade-in-up">
              <div className="bg-white rounded-3xl p-6 md:p-8 max-w-2xl w-full relative border-4 border-yellow-300 shadow-2xl bg-[url('https://www.transparenttextures.com/patterns/lined-paper-2.png')] max-h-[95vh] overflow-y-auto">
                <button 
                  onClick={() => setShowWorksheet(false)} 
                  className="absolute top-4 right-4 text-gray-500 hover:text-gray-800 text-3xl font-bold bg-gray-100 w-12 h-12 rounded-full flex items-center justify-center shadow z-10 border-2 border-gray-300"
                >
                  ✖
                </button>
                <h3 className="text-2xl font-bold text-yellow-700 mb-6 flex items-center border-b-2 border-yellow-200 pb-2"><span className="mr-2 text-3xl">📑</span> ワークシート</h3>
                
                <div className="grid grid-cols-1 gap-8">
                  <div className="bg-white/90 p-6 rounded-2xl border-4 border-blue-200 shadow-md">
                    <h4 className="font-bold text-blue-700 text-xl mb-4 bg-blue-100 px-4 py-2 rounded-lg inline-block shadow-sm">【わたしの こたえ】</h4>
                    
                    <div className="space-y-6 mb-2">
                      {worksheetData.map((ans, idx) => (
                        <div key={idx} className="bg-white p-4 rounded-xl shadow-sm border border-blue-100">
                          <div className="text-xl md:text-2xl font-worksheet font-bold text-blue-800 border-b-2 border-dashed border-blue-200 pb-4 mb-2 leading-loose text-left">
                            <AnswerTextWithHighlight isEn={true} data={ans} />
                          </div>
                          <p className="text-base text-gray-600 mt-4 font-bold bg-gray-50 inline-block px-3 py-2 rounded-xl border border-gray-200 leading-relaxed font-worksheet text-left">
                            <AnswerTextWithHighlight isEn={false} data={ans} />
                          </p>
                        </div>
                      ))}
                    </div>
                  </div>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
